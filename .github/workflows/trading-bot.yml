name: Trading Bot

# Runs main.py's normal continuous loop (unchanged) on GitHub's servers instead
# of a laptop, so it survives the laptop sleeping/closing. A single job can
# only run ~6h on GitHub Actions, and the NYSE session is 6.5h, so two
# back-to-back shifts cover the full day at the same loop cadence main.py
# already runs at (45-150s between scans) — nothing about the bot's own
# logic changes, it's just invoked from here instead of run_bot.bat.
#
# Times are UTC. Aug 29 - Sep 4 2026 is within US Eastern Daylight Time
# (UTC-4), so 13:20 UTC = 9:20am ET and 18:15 UTC = 2:15pm ET.
on:
  schedule:
    - cron: "20 13 * * 1-5"   # shift A: 9:20am ET start (10 min before open)
    - cron: "15 18 * * 1-5"   # shift B: 2:15pm ET start (picks up from shift A)
  workflow_dispatch: {}        # lets you manually trigger a run from the Actions tab

concurrency:
  group: trading-bot
  cancel-in-progress: false    # queue instead of running two shifts at once against the same account

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ github.event.schedule == '20 13 * * 1-5' && 295 || 105 }}
    env:
      ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
      ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
      PYTHONIOENCODING: utf-8
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run trading bot for this shift
        run: python main.py

      - name: Upload today's log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bot-log-${{ github.run_id }}
          path: logs/bot.log
          retention-days: 14
