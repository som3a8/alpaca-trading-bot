name: Trading Bots

# Runs three bots side by side, each against its own Alpaca account:
#   bot1  ensemble        the ML model (control)
#   bot2  sma_cross       moving-average crossover, no ML (baseline)
#   bot3  mean_reversion  buy dips / sell the bounce (contrarian)
#
# GitHub's scheduler is unreliable for this: ticks arrive hours late (often not
# until 2:30pm ET) and most are dropped. So the start is deliberately forgiving:
#   - many scheduled ticks, any one of which can start the day;
#   - a manual "Run workflow" click works the same way;
#   - an external timer can POST to the dispatch API (see README notes) for an
#     on-time 9:20am start.
# `concurrency` guarantees only one set of bots ever runs; extra ticks wait
# behind it and, finding the market closed, exit within a minute.
on:
  schedule:
    - cron: "7,22,37,52 12-19 * * 1-5"   # UTC; 8am-4pm EDT / 7am-3pm EST
  workflow_dispatch: {}

concurrency:
  group: trading-bots
  cancel-in-progress: false

permissions:
  contents: write   # commit each bot's trade history back
  actions: write    # start the continuation run

jobs:
  run:
    name: ${{ matrix.bot }} (${{ matrix.strategy }})
    runs-on: ubuntu-latest
    timeout-minutes: 355
    strategy:
      fail-fast: false   # one bot crashing must not take the others down
      matrix:
        include:
          - { bot: bot1, strategy: ensemble,       mtf: "1", key: BOT1_API_KEY, secret: BOT1_API_SECRET }
          - { bot: bot2, strategy: sma_cross,      mtf: "0", key: BOT2_API_KEY, secret: BOT2_API_SECRET }
          - { bot: bot3, strategy: mean_reversion, mtf: "0", key: BOT3_API_KEY, secret: BOT3_API_SECRET }
    env:
      ALPACA_API_KEY: ${{ secrets[matrix.key] }}
      ALPACA_SECRET_KEY: ${{ secrets[matrix.secret] }}
      STRATEGY: ${{ matrix.strategy }}
      MTF_ENABLED: ${{ matrix.mtf }}
      BOT_STATE_DIR: state/${{ matrix.bot }}
      EXIT_AFTER_CLOSE: "1"   # wait for the open, stop after the close
      MAX_RUNTIME_MIN: "345"  # stop just before GitHub's 6h kill; handoff continues
      PYTHONIOENCODING: utf-8
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run ${{ matrix.bot }}
        run: python main.py

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: log-${{ matrix.bot }}-${{ github.run_id }}
          path: logs/bot.log
          retention-days: 14

      # Each bot's pnl_log.json / signal_ledger.json lives in state/<bot>/ and is
      # tracked in git. The three bots push to the same branch at the same moment,
      # so retry with a rebase when one loses the race.
      - name: Commit updated trade history
        if: always()
        run: |
          git config user.name "trading-bot"
          git config user.email "actions@github.com"
          git add -A "state/${{ matrix.bot }}" || true
          git diff --staged --quiet && exit 0
          git commit -m "Update ${{ matrix.bot }} trade history (run ${{ github.run_id }})"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push && exit 0
            sleep $((i * 5))
          done
          echo "push failed after retries, continuing"

  # The trading day (6.5h) is longer than one job can live (6h). If this run
  # stopped because of its runtime cap and the market is still open, start a
  # continuation; it queues behind this run and takes over when it finishes.
  # Requiring 300+ minutes of runtime means a run that dies early can never
  # trigger a runaway chain of restarts.
  handoff:
    needs: run
    if: always() && needs.run.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mins=$(( ( $(date +%s) - $(date -d "${{ github.run_started_at }}" +%s) ) / 60 ))
          dow=$(TZ=America/New_York date +%u)
          hm=$((10#$(TZ=America/New_York date +%H%M)))
          echo "ran ${mins} min | ET weekday=${dow} time=${hm}"
          if [ "$mins" -ge 300 ] && [ "$dow" -le 5 ] && [ "$hm" -ge 930 ] && [ "$hm" -lt 1555 ]; then
            echo "Market still open - starting the continuation run."
            gh workflow run bots.yml --repo "${{ github.repository }}" --ref main
          else
            echo "No continuation needed."
          fi
